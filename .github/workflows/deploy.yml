name: Validate and deploy
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trainsworld-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            trainworld/app/package-lock.json
            trainworld/multiplayer/package-lock.json
      - name: Install Rust and WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm --prefix trainworld/app ci
      - run: npm --prefix trainworld/multiplayer ci
      - run: npm --prefix trainworld/multiplayer test
      - name: Build game and both WASM modules
        run: npm --prefix trainworld/app run build
      - name: Restore previous production assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: trainworld/multiplayer/.cloudflare/retained-assets
          key: production-assets-${{ github.run_id }}
          restore-keys: production-assets-
      - name: Prepare asset headers and retain the previous release
        run: npm --prefix trainworld/multiplayer run prepare:assets
      - name: Bundle Worker and validate deployment
        working-directory: trainworld/multiplayer
        run: |
          npm run build
          npm run check:build
          npx cf deploy --prebuilt --mode production --dry-run
      - name: Deploy main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: trainworld/multiplayer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '1ee487160d1c8983651d4fafc7be51c5'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the CLOUDFLARE_API_TOKEN repository secret for this Worker.'; exit 1; }
          npx cf deploy --prebuilt --mode production --provision=false
          node check-deployment.mjs
      - name: Replace the retained release after successful deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: trainworld/multiplayer
        run: node retain-current-assets.mjs
      - name: Save this production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: trainworld/multiplayer/.cloudflare/retained-assets
          key: production-assets-${{ github.run_id }}
